services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      STEPCHECK_PROVIDER: ${STEPCHECK_PROVIDER:-mock}
      STEPCHECK_MODEL: ${STEPCHECK_MODEL:-gpt-4o}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STEPCHECK_CORS_ORIGINS: '["http://localhost:3000"]'

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - backend
