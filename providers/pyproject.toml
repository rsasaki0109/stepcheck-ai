[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stepcheck-providers"
version = "0.1.0"
description = "Model-agnostic vision provider contracts and implementations for StepCheck AI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "StepCheck AI contributors" }]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["stepcheck_providers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
