[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stepcheck-providers"
version = "0.1.0"
description = "Model-agnostic vision provider contracts and implementations for StepCheck AI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "StepCheck AI contributors" }]
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
openai = ["openai>=2.0,<3"]
local = ["torch>=2.5", "transformers>=4.57.1,<5", "accelerate>=1.0", "Pillow>=10.1"]
quantized = ["bitsandbytes>=0.46,<0.49"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["stepcheck_providers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
